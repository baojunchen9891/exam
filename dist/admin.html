<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>真题考试通 · 管理员后台</title>
<link rel="stylesheet" href="assets/css/styles.css?v=202608060020">
  <link rel="stylesheet" href="assets/css/design-tokens.css?v=202608060020">
</head>
<body>
  <!-- 管理员登录(未认证时显示) -->
  <div id="adminAuth" class="authwrap" style="display:none">
    <div class="authcard">
      <h2>管理员登录</h2>
      <p class="sub">请输入管理员账号以进入后台</p>
      <div class="err" id="adminErr"></div>
      <div class="field"><label>用户名</label><input id="adminUser" placeholder="管理员用户名" autocomplete="username"></div>
      <div class="field"><label>密码</label><input id="adminPw" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
      <button class="btn" style="width:100%" id="adminLoginBtn">登录后台</button>
      <div class="authswitch"><a href="/index.html">返回站点首页</a></div>
    </div>
  </div>

  <!-- 后台主体(认证后显示) -->
  <div id="adminMain" style="display:none">
    <header id="nav" class="top"></header>
    <div class="container">
      <h2 class="section-title">管理员后台</h2>
      <p style="color:var(--color-text-meta);margin-top:-4px">用户审核与平台概览。只有管理员账号可访问本页。</p>

      <div class="admin-stats" id="stats"></div>

      <h3 class="section-title" style="margin-top:26px">用户管理</h3>
      <div class="filter-group" style="margin-bottom:12px">
        <span class="chip active" data-f="all">全部</span>
        <span class="chip" data-f="pending">待审核</span>
        <span class="chip" data-f="approved">已通过</span>
        <span class="chip" data-f="rejected">已拒绝</span>
      </div>
      <table class="usertable">
        <thead><tr><th>用户名</th><th>角色</th><th>注册时间</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="userRows"></tbody>
      </table>
      <div class="empty" id="userEmpty" style="display:none">没有符合条件的用户</div>
    </div>
  </div>

  <script src="assets/js/lucide.min.js?v=202608060020"></script>
  <script src="assets/js/cloudbase.js?v=202608060020"></script>
  <script src="assets/js/api.js?v=202608061700"></script>
  <script src="assets/js/common.js?v=202608061700"></script>
  <script src="assets/js/admin.js?v=202608052000"></script>
</body>
</html>
