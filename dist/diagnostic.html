<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>免费能力诊断 · 真题考试通</title>
<link rel="stylesheet" href="assets/css/styles.css?v=202608051800">
<link rel="stylesheet" href="assets/css/diagnostic.css?v=202608051800">
</head>
<body>
<header id="nav" class="top"></header>
<main class="diag">

  <section id="intro" class="intro">
    <h1>免费 GESP 能力诊断</h1>
    <p>3 分钟、32 道真题，测出你通过 <b>GESP C++ 一至八级（任选）</b> 的真实概率，并定位薄弱考点。</p>
    <ul class="intro-pts">
      <li>✓ 基于真实历年真题抽题</li>
      <li>✓ 规则引擎给出通过概率 + 档位</li>
      <li>✓ 薄弱考点 Top5 + 补弱建议</li>
    </ul>
    <div id="levelSel" class="level-sel"></div>
    <button id="startBtn" class="bigbtn">开始免费诊断</button>
    <p class="intro-sub">无需登录，结果可登录后保存</p>
  </section>

  <section id="quiz" class="quiz" style="display:none">
    <div class="quiz-top">
      <span id="curNo"></span>
      <div class="quiz-actions">
        <button id="prevBtn">上一题</button>
        <button id="nextBtn">下一题</button>
        <button id="submitBtn" class="submit">交卷看结果</button>
      </div>
    </div>
    <div id="qnav" class="qnav"></div>
    <div id="examArea"></div>
  </section>

  <section id="reportWrap" class="report-wrap" style="display:none">
    <h2>你的诊断报告</h2>
    <div id="report"></div>
    <div id="teacherEstimate" class="te"></div>
    <div id="memberCta" class="member-cta"></div>
  </section>

</main>

<script src="assets/js/cloudbase.js?v=202608051800"></script>
<script src="assets/js/common.js?v=202608051800"></script>
<script src="assets/js/rule_prob.js?v=202608051800"></script>
<script src="assets/js/analytics.js?v=202608051800"></script>
<script src="assets/js/membership.js?v=202608051800"></script>
<script src="assets/js/report.js?v=202608051800"></script>
<script src="assets/js/diagnostic.js?v=202608051800"></script>
</body>
</html>
