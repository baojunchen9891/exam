<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>页面走丢了 · 真题考试通</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: #f1f5f9; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
  .nf-topbar { height: 56px; background: linear-gradient(135deg, #2563eb, #3b82f6);
               display: flex; align-items: center; padding: 0 22px; color: #fff; font-weight: 700; font-size: 17px;
               letter-spacing: .5px; box-shadow: 0 2px 8px rgba(37,99,235,.18); }
  .nf-topbar .dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; margin-right: 10px; opacity: .9; }
  .nf-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .nf-card { background: #fff; border-radius: 16px; padding: 48px 40px; text-align: center;
             box-shadow: 0 10px 30px rgba(15,23,42,.08); max-width: 460px; width: 100%; }
  .nf-code { font-size: 92px; font-weight: 800; line-height: 1;
             background: linear-gradient(135deg, #2563eb, #3b82f6); -webkit-background-clip: text;
             background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
  .nf-title { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  .nf-sub { color: #64748b; font-size: 14px; line-height: 1.7; margin-bottom: 28px; }
  .nf-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .nf-btn { display: inline-block; padding: 11px 22px; border-radius: 10px; font-size: 14px; font-weight: 600;
            text-decoration: none; transition: transform .12s ease, box-shadow .12s ease; }
  .nf-btn:hover { transform: translateY(-1px); }
  .nf-btn-primary { background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,.3); }
  .nf-btn-ghost { background: #f1f5f9; color: #334155; }
  .nf-foot { text-align: center; color: #94a3b8; font-size: 12px; padding: 16px; }
  .nf-foot a { color: #64748b; }
</style>
</head>
<body>
  <div class="nf-topbar"><span class="dot"></span>真题考试通</div>
  <div class="nf-wrap">
    <div class="nf-card">
      <div class="nf-code">404</div>
      <div class="nf-title">页面走丢了</div>
      <div class="nf-sub">你访问的页面不存在或已被移动。<br>试试返回首页，或前往你的考试记录。</div>
      <div class="nf-actions">
        <a class="nf-btn nf-btn-primary" href="/index.html">返回首页</a>
        <a class="nf-btn nf-btn-ghost" href="/records.html">我的记录</a>
        <a class="nf-btn nf-btn-ghost" href="/admin.html">管理后台</a>
      </div>
    </div>
  </div>
  <div class="nf-foot">真题考试通 · 青少年软件编程考级真题模拟平台</div>
</body>
</html>
