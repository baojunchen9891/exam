<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>注册 · 真题考试通</title>
  <link rel="stylesheet" href="assets/css/design-tokens.css?v=202608060020">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-family-base); background: var(--color-bg); color: var(--color-text); }
    .wrap { max-width: 420px; margin: 60px auto; padding: 0 20px; }
    .brand { font-size: 26px; font-weight: 800; color: var(--color-primary); margin-bottom: 6px; }
    .sub { color: var(--color-text-secondary); margin-bottom: 28px; font-size: 14px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; }
    .field input { width: 100%; height: 46px; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 0 14px; font-size: 15px; outline: none; background: var(--color-surface-warm); }
    .field input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-focus-ring); }
    .btn { width: 100%; height: 50px; border: none; border-radius: var(--radius-pill); background: var(--color-primary); color: var(--color-primary-on); font-size: 16px; font-weight: 600; cursor: pointer; transition: background var(--motion-fast) var(--motion-ease); }
    .btn:hover { background: var(--color-primary-hover); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .tip { margin-top: 14px; font-size: 13px; color: var(--color-text-secondary); text-align: center; }
    .tip a { color: var(--color-primary); text-decoration: none; }
    .err { color: var(--color-danger); font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">真题考试通 · 注册</div>
    <div class="sub">GESP C++ 1-8 级 · 手机号即你的跨端账号</div>
    <form id="form">
      <div class="field">
        <label>用户名</label>
        <input id="username" type="text" placeholder="用于登录，4-20 位" autocomplete="username" />
      </div>
      <div class="field">
        <label>手机号</label>
        <input id="phone" type="tel" placeholder="11 位手机号，用于跨端统一身份" autocomplete="tel" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="password" type="password" placeholder="至少 8 位" autocomplete="new-password" />
      </div>
      <div class="field">
        <label>确认密码</label>
        <input id="confirm" type="password" placeholder="再次输入密码" autocomplete="new-password" />
      </div>
      <button class="btn" type="submit" id="submit">注册</button>
      <div class="err" id="err"></div>
    </form>
    <div class="tip">已有账号？<a href="login.html">去登录</a></div>
  </div>

  <script src="assets/js/lucide.min.js?v=202608060020"></script>
  <script src="assets/js/cloudbase.js?v=202608060020"></script>
  <script src="assets/js/api.js?v=202608061700"></script>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    $('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var username = $('username').value.trim();
      var phone = $('phone').value.trim();
      var pwd = $('password').value;
      var confirm = $('confirm').value;
      var err = $('err');
      err.textContent = '';
      if (!username || !phone || !pwd) { err.textContent = '请完整填写'; return; }
      if (!/^1\d{10}$/.test(phone)) { err.textContent = '手机号格式不正确'; return; }
      if (pwd.length < 8) { err.textContent = '密码至少 8 位'; return; }
      if (pwd !== confirm) { err.textContent = '两次密码不一致'; return; }
      $('submit').disabled = true;
      window.EXAM.register(username, pwd, phone)
        .then(function (res) {
          if (!res.ok) { err.textContent = res.msg || '注册失败'; return; }
          location.href = 'login.html';
        })
        .catch(function (e2) { err.textContent = (e2 && e2.message) || '注册失败'; })
        .then(function () { $('submit').disabled = false; });
    });
  </script>
</body>
</html>
