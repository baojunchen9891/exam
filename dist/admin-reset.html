<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>账号体系说明 · 真题考试通</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fb;color:#1f2937;margin:0;padding:24px;line-height:1.6}
  .card{max-width:480px;margin:60px auto;background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
  h2{margin:0 0 8px;font-size:22px}
  .sub{color:#64748b;margin-bottom:20px;font-size:14px}
  .row{margin:12px 0;padding:12px;background:#f8fafc;border-radius:10px;font-size:13px;word-break:break-all}
  .ok{color:#15803d;background:#dcfce7}
  .btn{display:block;width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;margin-top:12px}
  .btn.secondary{background:#475569}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#e2e8f0;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div class="card">
  <h2>账号体系已升级为云端</h2>
  <p class="sub">本站的账号与审核已迁移到云端（CloudBase）统一管理，旧版「本地权限修复」工具不再适用。</p>
  <div class="row ok">✅ 账号数据现存储在云端：注册后由站长在「管理员后台」审核通过即可登录，支持多设备使用。</div>
  <div class="row">管理员默认账号：<code>admin</code> / <code>admin888</code>（已在云端初始化）。如需重置管理员密码，请在前端「管理员登录」使用正确密码，或联系开发者重新执行云端初始化。</div>
  <a class="btn" href="/admin.html">进入管理员后台</a>
  <a class="btn secondary" href="/index.html">返回站点首页</a>
</div>
</body>
</html>
