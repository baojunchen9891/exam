<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>忘记密码 · 真题考试通</title>
<link rel="stylesheet" href="assets/css/design-tokens.css?v=202608060020">
<style>
  *{box-sizing:border-box}
  body{font-family:var(--font-family-base);background:var(--color-bg);color:var(--color-text);margin:0;padding:24px;line-height:1.7}
  .card{max-width:480px;margin:60px auto;background:var(--color-surface);border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow-raised)}
  h2{margin:0 0 8px;font-size:22px}
  .sub{color:var(--color-text-secondary);margin-bottom:20px;font-size:14px}
  .ic{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
  .row{margin:12px 0;padding:14px;background:var(--color-surface-warm);border-radius:var(--radius-md);font-size:14px}
  .warn{color:var(--color-warning);background:var(--color-amber-100);border:1px solid var(--color-amber-200)}
  .ok{color:var(--color-success);background:var(--color-green-100);border:1px solid var(--color-green-200)}
  .btn{display:block;width:100%;padding:12px;border:0;border-radius:var(--radius-md);background:var(--color-primary);color:var(--color-primary-on);font-size:15px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;margin-top:12px}
  .btn.secondary{background:var(--color-text-secondary)}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--color-border-soft);padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div class="card">
  <h2>忘记密码</h2>
  <p class="sub">登录后可直接修改密码。</p>
  <div class="row warn">
    <i data-lucide="alert-triangle" class="ic"></i>若你忘记了登录密码，请使用<strong>注册时的手机号</strong>联系本站管理员，
    由管理员为你<strong>重置并生成一个新的随机密码</strong>，再通过安全方式发给你。
  </div>
  <div class="row ok">
    <i data-lucide="check-circle" class="ic"></i>拿到新密码后，请尽快<strong>登录本系统并修改为你自己的常用密码</strong>（密码至少 8 位）：
    登录后点击右上角头像旁的「<strong>修改密码</strong>」即可设置。
  </div>
  <a class="btn" href="/index.html">返回站点首页</a>
  <a class="btn secondary" href="/admin.html">进入管理员后台</a>
</div>
  <script src="assets/js/lucide.min.js?v=202608060020"></script>
  <script src="assets/js/cloudbase.js?v=202608060020"></script>
  <script src="assets/js/api.js?v=202608061700"></script>
</body>
</html>
