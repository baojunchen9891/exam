<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>开始考试 · 真题考试通</title>
<link rel="stylesheet" href="assets/css/styles.css?v=202608052348">
</head>
<body>
<header id="nav" class="top"></header>
<div class="exambar">
  <a class="backlink" href="/index.html" style="margin:0">← 退出</a>
  <div id="examTitle" style="font-weight:700"></div>
  <div class="spacer"></div>
  <div class="timer" id="timer">--:--</div>
  <button class="btn red sm" id="submitBtn">提交试卷</button>
</div>
<div class="container">
  <div class="qnav" id="qnav"></div>
  <div id="examArea"></div>
  <div class="toolbar">
    <button class="btn ghost" id="prevBtn">← 上一题</button>
    <button class="btn" id="nextBtn">下一题 →</button>
  </div>
</div>

<div id="resultModal" class="modal" style="display:none">
  <div class="box">
    <h3>考试结果</h3>
    <div id="resultBody"></div>
    <div class="toolbar" style="margin-top:16px">
      <button class="btn ghost" id="reviewBtn">查看解析</button>
      <a class="btn" href="/records.html">我的记录</a>
      <a class="btn amber" href="/index.html">返回首页</a>
    </div>
  </div>
</div>

<script src="assets/js/cloudbase.js?v=202608052348"></script>
<script src="assets/js/common.js?v=202608052348"></script>
